name: Homework 6 security

on:
  pull_request:
    paths:
      - 'practices/practice_06/**'
      - '.github/workflows/homework-06.yml'
      - 'Makefile'

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check homework including real TCP transport
        run: make step6
      - name: Check all repository exercises
        run: make test
      - name: Verify paired exploit evidence
        working-directory: practices/practice_06
        run: python3 tools/verify_evidence.py
