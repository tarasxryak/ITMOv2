<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Looksmax Grocery</title>
    <meta
      name="description"
      content="Две игры на продуктах ВкусВилла: дуэль «где больше белка» и корзина на бюджет с максимумом белка. Ранг от sub3 до true adam."
    />
    <meta name="theme-color" content="#E9F0F1" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230D3B2E'/%3E%3Ccircle cx='16' cy='8' r='2.6' fill='%23E9F0F1'/%3E%3Crect x='6' y='15' width='20' height='10' rx='3' fill='%23FFD23F'/%3E%3C/svg%3E"
    />
    <script>
      // Тема из профиля применяется до первой отрисовки, чтобы страница не мигала светлым.
      try {
        var saved = JSON.parse(localStorage.getItem("looksmax-profile") || "null")
        var theme = saved && ["light", "dark", "sakura", "cyberpunk"].indexOf(saved.theme) >= 0 ? saved.theme : "light"
        var root = document.documentElement
        if (theme === "sakura" || theme === "cyberpunk") root.setAttribute("data-theme", theme)
        root.classList.toggle("dark", theme === "dark" || theme === "cyberpunk")
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
